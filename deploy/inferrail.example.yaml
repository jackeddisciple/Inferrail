# Inferrail gateway configuration. Only models and at least one replica or
# DNS group are required; the values below are the defaults unless noted.

server:
  listen: 0.0.0.0:8080
  admin_listen: 127.0.0.1:9090
  request_timeout: 10m
  max_body_bytes: 33554432
  header_read_timeout: 30s
  shutdown_timeout: 30s

# A model's tokenizer is a model directory, a repository id already in the
# local Hugging Face cache (org/name or org/name@revision), or builtin:sim for
# inferrail-sim. Models without one are routed without cache predictions.
# chat_template, chat_template_content_format and chat_template_kwargs mirror
# the vLLM flags of the same names and must match how the engines run.
models:
  - name: meta-llama/Llama-3.1-8B-Instruct
    aliases: [llama-8b]
    block_size: 16
    tokenizer: meta-llama/Llama-3.1-8B-Instruct
  - name: Qwen/Qwen3-8B
    policy: least_request
    tokenizer: Qwen/Qwen3-8B
    chat_template_kwargs:
      enable_thinking: false

replicas:
  - id: gpu-0
    url: http://10.0.0.10:8000
    models: [meta-llama/Llama-3.1-8B-Instruct]
    kv_capacity_blocks: 18000
  - id: gpu-1
    url: http://10.0.0.11:8000
    models: [meta-llama/Llama-3.1-8B-Instruct]
    kv_capacity_blocks: 18000
  - id: gpu-2
    url: http://10.0.0.12:8000
    models: [meta-llama/Llama-3.1-8B-Instruct, Qwen/Qwen3-8B]
    max_concurrency: 256
    max_pending: 32

# Every address a name resolves to becomes a replica named <name>-<ip>-<port>.
discovery:
  dns:
    - name: qwen-pool
      url: http://qwen.inference.svc.cluster.local:8000
      models: [Qwen/Qwen3-8B]
      refresh: 2s
      max_concurrency: 128

upstream:
  connect_timeout: 2s
  pool_idle_timeout: 90s
  pool_max_idle_per_host: 1024
  http2: false

routing:
  default_policy: cost_model
  epsilon: 0.25
  kappa: 0.92

health:
  interval: 1s
  timeout: 500ms
  unhealthy_threshold: 3
  healthy_threshold: 2
  ejection_backoff: 5s
  max_ejection_backoff: 1m
  max_ejection_percent: 50

retry:
  max_attempts: 3
  backoff: 25ms

logging:
  level: info
  log_prompts: false

# Engine /metrics pages are scraped every scrape_interval; samples older than
# max_age are ignored and routing falls back to the gateway's own counts.
load:
  enabled: true
  scrape_interval: 100ms
  scrape_timeout: 100ms
  max_age: 250ms

# Prompts are tokenized at the edge. Short ones are tokenized on the request's
# own thread, long ones on the worker pool; a request that finds the queue
# full, or waits longer than max_wait, is routed without a cache prediction.
# Repeated prompt pieces (system prompts, earlier turns) are kept per model.
tokenizer:
  workers: 0
  queue: 1024
  max_wait: 50ms
  cache_tokens: 4194304

# Every routed prompt is recorded as cached on the replica it went to, in a
# shadow LRU sized to that replica's KV capacity: kv_capacity_blocks when
# set, otherwise what its engine reports, otherwise default_capacity_blocks.
# An attempt the engine refuses or fails before answering is taken back.
index:
  enabled: true
  default_capacity_blocks: 16384

# Prometheus metrics are always served on server.admin_listen at /metrics.
observability:
  # otlp_endpoint: http://localhost:4318/v1/traces
  service_name: inferrail-gateway
  trace_sample_ratio: 1.0
  decision_log:
    # path: /var/log/inferrail/decisions.jsonl
    sample_rate: 0.0

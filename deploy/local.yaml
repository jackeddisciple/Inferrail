# Three local simulators behind one gateway, as in the README quick start.
server:
  listen: 127.0.0.1:8080
  admin_listen: 127.0.0.1:9090

models:
  - name: inferrail/sim-8b
    aliases: [sim]
    tokenizer: builtin:sim

replicas:
  - id: sim-0
    url: http://127.0.0.1:8001
    models: [inferrail/sim-8b]
  - id: sim-1
    url: http://127.0.0.1:8002
    models: [inferrail/sim-8b]
  - id: sim-2
    url: http://127.0.0.1:8003
    models: [inferrail/sim-8b]

routing:
  default_policy: least_request

health:
  interval: 500ms
  timeout: 250ms

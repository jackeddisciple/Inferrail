name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo nextest run --workspace --profile ci
      - name: Doc tests
        run: cargo test --workspace --doc

  python:
    name: Python
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bench
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          working-directory: bench
      - name: Lint
        run: uv run --frozen ruff check . && uv run --frozen ruff format --check .
      - name: Tests
        run: uv run --frozen pytest -q

  supply-chain:
    name: Dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit,cargo-machete
      - name: Advisories
        run: cargo audit --deny warnings
      - name: Unused dependencies
        run: cargo machete

  e2e:
    name: OpenAI SDK against the simulator and gateway
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
      - name: Build simulator and gateway
        run: cargo build -p inferrail-sim -p inferrail-gateway
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          working-directory: bench
      - name: SDK suite
        working-directory: bench
        env:
          INFERRAIL_SIM_BIN: ${{ github.workspace }}/target/debug/inferrail-sim
          INFERRAIL_GATEWAY_BIN: ${{ github.workspace }}/target/debug/inferrail-gateway
        run: uv run --frozen pytest -q -m e2e

[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.4"
edition = "2024"
rust-version = "1.98"
license = "MIT"
repository = "https://github.com/jackeddisciple/Inferrail"
publish = false

[workspace.dependencies]
inferrail-control = { path = "crates/inferrail-control" }
inferrail-core = { path = "crates/inferrail-core" }
inferrail-load = { path = "crates/inferrail-load" }
inferrail-policy = { path = "crates/inferrail-policy" }
inferrail-sim = { path = "crates/inferrail-sim" }
anyhow = "1.0.104"
arc-swap = "1.9.3"
async-stream = "0.3.6"
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio", "tracing"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }
futures = "0.3.34"
http-body-util = "0.1.5"
humantime-serde = "1.1.1"
hyper = { version = "1.12.0", features = ["client", "http1", "http2", "server"] }
hyper-util = { version = "0.1.21", features = ["client-legacy", "http1", "http2", "server-auto", "server-graceful", "service", "tokio"] }
insta = "1.49.0"
opentelemetry = { version = "0.33.1", default-features = false, features = ["trace"] }
opentelemetry-otlp = { version = "0.33.1", default-features = false, features = ["http-proto", "reqwest-blocking-client", "trace"] }
opentelemetry_sdk = { version = "0.33.1", default-features = false, features = ["trace"] }
prometheus-client = "0.25.1"
proptest = "1.12"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "stream"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["float_roundtrip", "raw_value"] }
serde-saphyr = "2.0.0"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tower = { version = "0.5.3", default-features = false, features = ["util"] }
tracing = "0.1.44"
tracing-opentelemetry = { version = "0.34.0", default-features = false }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = { version = "2.5.8", features = ["serde"] }
xxhash-rust = { version = "0.8.19", features = ["xxh3"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
unwrap_used = "warn"
dbg_macro = "warn"
todo = "warn"
print_stderr = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
debug = "line-tables-only"

[profile.bench]
inherits = "release"

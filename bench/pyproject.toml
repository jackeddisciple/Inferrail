[project]
name = "inferrail-bench"
version = "0.1.10"
description = "Workload generation, benchmark runner and analysis for Inferrail."
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "httpx2>=2.16",
    "matplotlib>=3.10",
    "numpy>=2.3",
]

[project.scripts]
inferrail-bench = "inferrail_bench.cli:main"

[dependency-groups]
dev = [
    "msgspec>=0.22.0",
    "openai>=3.30",
    "pytest>=8.3",
    "pyzmq>=27.2.0",
    "ruff>=0.14",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -m 'not e2e and not stress'"
markers = [
    "e2e: drives real inferrail-sim and inferrail-gateway binaries through the official OpenAI SDK",
    "stress: heavy concurrent load through the OpenAI SDK, direct and via the gateway",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "I", "SIM", "PT", "RUF"]

[tool.ruff.lint.isort]
known-local-folder = ["conftest"]

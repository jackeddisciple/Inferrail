[project]
name = "inferrail-bench"
version = "0.1.0"
description = "Workload generation, benchmark runner and analysis for Inferrail."
requires-python = ">=3.12"
license = "MIT"
dependencies = []

[dependency-groups]
dev = ["openai>=3.30", "pytest>=8.3"]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -m 'not e2e and not stress'"
markers = [
    "e2e: drives a real inferrail-sim binary through the official OpenAI SDK",
    "stress: heavy concurrent load through the OpenAI SDK",
]
